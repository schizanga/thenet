{{ define "main" }}
<content>
  {{ if .Data.Singular }}
    <h3 style="margin-bottom:0">Filtering for "{{ .Title }}"</h3>
    <small><a href="{{ "/" | relURL }}">Remove filter</a></small>
  {{ end }}

  <ul class="custom-post-list">
    {{ range .Pages }}
    <li class="post-item">
      <div class="post-row">
        <a href="{{ .Permalink }}" class="post-title">
          {{ .Title }}
        </a>
        <span class="post-date">{{ .Date.Format "2 Jan, 2006" }}</span>
      </div>

      {{ if .Description }}
      <p class="post-summary">{{ .Description }}</p>
      {{ end }}
    </li>
    {{ else }}
    <li>No posts yet</li>
    {{ end }}
  </ul>
</content>
{{ end }}
